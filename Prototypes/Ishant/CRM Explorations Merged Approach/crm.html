<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM — Titan</title>
  <link rel="stylesheet" href="crm/crm_full.css">
</head>
<body>

  <!-- ── Top bar ───────────────────────────────────────────── -->
  <div class="f-top">
    <div class="f-grid" title="Apps" onclick="location.href='index.html'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="5" r="1.9"/><circle cx="12" cy="5" r="1.9"/><circle cx="19" cy="5" r="1.9"/>
        <circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/>
        <circle cx="5" cy="19" r="1.9"/><circle cx="12" cy="19" r="1.9"/><circle cx="19" cy="19" r="1.9"/>
      </svg>
    </div>

    <div class="f-brand"><span class="f-brand-mark">C</span>CRM</div>

    <div class="f-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Filter this view" oninput="CrmFull.search(this)">
    </div>

    <div class="f-top-right">
      <a class="f-back-mail" href="index.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M3 7l9 6 9-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Back to Mail
      </a>
      <div class="f-me" id="fMe">MR</div>
    </div>
  </div>

  <!-- ── Shell ─────────────────────────────────────────────── -->
  <div class="f-shell">
    <div class="f-nav" id="fNav"></div>
    <div class="f-main" id="fMain"></div>
  </div>

  <!-- ── Data, then queries, then UI. Same core as the sidebar:
       one crm_data.js, so the two surfaces cannot disagree about
       what the data means. See crm/README.md §5.            ── -->
  <script src="crm/data/pipelines.js"></script>
  <script src="crm/data/companies.js"></script>
  <script src="crm/data/contacts.js"></script>
  <script src="crm/data/opportunities.js"></script>
  <script src="crm/data/links.js"></script>
  <script src="crm/data/activities.js"></script>
  <script src="crm/data/accounts/maya.js"></script>
  <script src="crm/crm_data.js"></script>
  <script src="crm/crm_full.js"></script>
</body>
</html>
