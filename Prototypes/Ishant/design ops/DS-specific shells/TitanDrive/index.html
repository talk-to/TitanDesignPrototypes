<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan Drive</title>
<script>
const dsBase=location.pathname.startsWith('/app/')?'/design-system/':'../../../../../design-system/';
for(const file of ['tokens.css','components/actions.css','components/navigation-input.css','components/selection.css','components/sidebar-header.css','patterns/app-switcher.css','components/app-switcher.css','components/avatar.css','components/data-list.css','icons/icons.css'])document.write('<link rel="stylesheet" href="'+dsBase+file+'">');
document.write('<script src="'+dsBase+'theme.js"><\/script>');
</script>
<link rel="stylesheet" href="drive.css">
</head>
<body>
<div class="drive-app">
  <aside class="sidebar" aria-label="Drive sidebar">
    <div id="sidebar-header-host"></div>

    <nav class="drive-nav" aria-label="Drive views">
      <div id="nav-my-drive"></div>
      <div id="nav-transfers"></div>
      <div id="nav-branding"></div>
      <hr class="nav-divider">
      <div id="nav-trash"></div>
    </nav>

    <footer class="sidebar-footer">
      <p class="storage-note">Storage used: 7.2 KB / 50 GB</p>
      <div class="sidebar-links">
        <div id="nav-footer"></div>
      </div>
    </footer>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="toolbar-left">
        <div id="upload-host"></div>
        <div id="search-host" class="search-host"></div>
        <div id="filters-host"></div>
      </div>
      <div class="toolbar-right">
        <div id="account-picker-host"></div>
      </div>
    </header>

    <section class="content" aria-labelledby="drive-title">
      <div class="content-head">
        <h1 id="drive-title" class="content-title">My Drive</h1>
        <div id="new-folder-host"></div>
      </div>
      <div id="drive-table" class="drive-table"></div>
    </section>

    <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>
  </main>
</div>

<script>
for(const file of ['icons/runtime.js','components/actions.js','components/navigation-input.js','components/selection.js','components/app-switcher.js','patterns/app-switcher.js','app-switcher-config.js','components/sidebar-header.js','components/avatar.js','components/data-list.js'])document.write('<script src="'+dsBase+file+'"><\/script>');
</script>
<script src="drive.js"></script>
<script>
if(new URLSearchParams(location.search).get('ds')==='true'){
  const studio=location.pathname.startsWith('/app/');
  const workspace=new URL('../../../../../',location.href);
  window.dsInspectorConfig={
    registryUrl:studio?'/design-system/registry.json':new URL('design-system/registry.json',workspace).href,
    workbenchUrl:(studio?location.origin:'http://localhost:8032')+'/#components'
  };
  const script=document.createElement('script');
  script.src=studio?'/framework/spacing-inspector.js':new URL('Prototypes/Ishant/design ops/design system/framework/spacing-inspector.js',workspace).href;
  document.head.append(script);
}
</script>
<script src="../../../ds specific prototypes/App sidebar/derived-inspection.js"></script>
</body>
</html>
