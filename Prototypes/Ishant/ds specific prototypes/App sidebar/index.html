<!doctype html>
<html lang="en">
<head>
  <script>window.appSidebarDsBase = location.pathname.startsWith("/app/") ? "/design-system/" : "../../../../design-system/";</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App sidebar · Titan</title>
  <script>document.write("<link rel=\"stylesheet\" href=\"" + window.appSidebarDsBase + "tokens.css\">");</script>
  <script>document.write("<link rel=\"stylesheet\" href=\"" + window.appSidebarDsBase + "components/actions.css\">");</script>
  <script>document.write("<link rel=\"stylesheet\" href=\"" + window.appSidebarDsBase + "icons/icons.css\">");</script>
  <link rel="stylesheet" href="app-sidebar.css">
  <style>
    .app-rail__apps .app-rail-icon-button--local > img,
    .app-rail__apps .app-rail-icon-button--local > svg {
      transition: filter 120ms ease, opacity 120ms ease, width 160ms ease, height 160ms ease;
    }
    body[data-sidebar-icon-size="scaled"] .app-rail__apps .app-rail-icon-button--local > img,
    body[data-sidebar-icon-size="scaled"] .app-rail__apps .app-rail-icon-button--local > svg {
      width: 24px;
      height: 24px;
    }
    @media (prefers-reduced-motion: reduce) {
      .app-rail__apps .app-rail-icon-button--local > img,
      .app-rail__apps .app-rail-icon-button--local > svg {
        transition: none;
      }
    }
  </style>
  <script>document.write("<script src=\"" + window.appSidebarDsBase + "theme.js\"><\/script>");</script>
</head>
<body>
  <main class="app-stage" aria-label="Titan app sidebar prototype">
    <nav class="app-rail" aria-label="Switch Titan app">
      <div class="app-rail__apps" id="app-rail-apps" role="list"></div>
      <div class="app-rail__footer" id="app-rail-footer" role="list" aria-label="Titan tools"></div>
    </nav>
    <div class="app-rail-tooltip" id="app-rail-tooltip" role="tooltip" hidden></div>
    <div class="more-apps-listbox" id="more-apps-listbox" role="listbox" aria-label="More apps" hidden></div>
    <section class="app-views" id="app-views" aria-label="Current app"></section>
    <aside class="sidebar-variant-panel" aria-label="Sidebar variations">
      <button type="button" class="sidebar-variant-panel__handle" aria-label="Move iterations tray. Use arrow keys to move." title="Drag to move · H to hide/show"><span aria-hidden="true">⠿</span> Iterations <span class="sidebar-variant-panel__hint">H to hide</span></button>
      <div class="sidebar-variant-panel__control sidebar-variant-panel__control--color">
        <label class="sidebar-variant-panel__label" for="sidebar-color-select">Color</label>
        <select id="sidebar-color-select" aria-label="Color">
          <option value="grayscale">Grayscale</option>
          <option value="colored-top" selected>Colored top only</option>
          <option value="colored">Colored top + bottom</option>
        </select>
      </div>
      <div class="sidebar-variant-panel__control sidebar-variant-panel__control--layout">
        <label class="sidebar-variant-panel__label" for="sidebar-layout-select">Layout</label>
        <select id="sidebar-layout-select" aria-label="Layout">
          <option value="top">Top</option>
          <option value="top-labels">Top + labels</option>
          <option value="top-more">Top + more</option>
          <option value="centered-more">Centered + more</option>
        </select>
      </div>
      <div class="sidebar-variant-panel__control sidebar-variant-panel__control--transition">
        <label class="sidebar-variant-panel__label" for="app-transition-select">Interaction pattern</label>
        <select id="app-transition-select" aria-label="App interaction pattern">
          <option value="spinner">Slide + loader</option>
          <option value="slide-skeleton">Slide + skeleton</option>
          <option value="skeleton">Instant + skeleton</option>
          <option value="instant">Instant + loader</option>
        </select>
      </div>
      <div class="sidebar-variant-panel__control sidebar-variant-panel__control--size">
        <label class="sidebar-variant-panel__label" for="sidebar-icon-size-select">Icon size</label>
        <select id="sidebar-icon-size-select" aria-label="App icon size">
          <option value="normal">Small</option>
          <option value="scaled" selected>Large</option>
        </select>
      </div>
      <div class="sidebar-variant-panel__control sidebar-variant-panel__control--right-sidebar">
        <label class="sidebar-variant-panel__label" for="right-sidebar-select">Right sidebar</label>
        <select id="right-sidebar-select" aria-label="Right sidebar">
          <option value="embedded" selected>Embedded</option>
          <option value="floating">Floating</option>
        </select>
      </div>
    </aside>
    <p class="sr-only" id="app-announcement" aria-live="polite"></p>
  </main>
  <script>document.write("<script src=\"" + window.appSidebarDsBase + "icons/runtime.js\"><\/script>");</script>
  <script>document.write("<script src=\"" + window.appSidebarDsBase + "components/actions.js\"><\/script>");</script>
  <script src="app-sidebar.js"></script>
  <script src="iteration-tray.js"></script>
  <script>
    (() => {
      const sizeSelect = document.getElementById('sidebar-icon-size-select');
      const initialSize = new URLSearchParams(location.search).get('icon-size') === 'normal' ? 'normal' : 'scaled';
      document.body.dataset.sidebarIconSize = initialSize;
      sizeSelect.value = initialSize;
      sizeSelect.addEventListener('change', () => {
        document.body.dataset.sidebarIconSize = sizeSelect.value;
      });
    })();
  </script>
  <script>
    (() => {
      if (new URLSearchParams(location.search).get('ds') !== 'true') return;
      const studio = location.pathname.startsWith('/app/');
      const workspace = new URL('../../../../', location.href);
      const script = document.createElement('script');
      window.dsInspectorConfig = {
        registryUrl: studio ? '/design-system/registry.json' : new URL('design-system/registry.json', workspace).href,
        workbenchUrl: studio ? '/#components' : 'http://127.0.0.1:8031/#components'
      };
      script.src = studio ? '/framework/spacing-inspector.js' : new URL('Prototypes/Ishant/design ops/design system/framework/spacing-inspector.js', workspace).href;
      script.onerror = () => console.error('Could not load the design-system inspector. Open this prototype through the Titan studio with ?ds=true.');
      document.head.append(script);
    })();
