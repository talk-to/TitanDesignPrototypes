<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titan app placeholder</title>
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/icons/icons.css">
  <script src="/design-system/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: var(--titan-surface-base);
      color: var(--titan-text-primary);
      font-family: var(--titan-font-family-ui);
    }
    main { display: grid; justify-items: center; gap: var(--titan-space-12); text-align: center; }
    .app-artwork { width: 32px; height: 32px; }
    .app-artwork img, .app-artwork svg { width: 100%; height: 100%; }
    h1 { margin: 0; font-size: var(--titan-type-heading-size); font-weight: var(--titan-type-heading-weight); }
    p { margin: 0; color: var(--titan-text-secondary); font-size: var(--titan-type-body-size); }
  </style>
</head>
<body>
  <main>
    <div class="app-artwork" id="app-artwork" aria-hidden="true"></div>
    <h1 id="app-name"></h1>
    <p>This app shell is not connected in this prototype.</p>
  </main>
  <script src="/design-system/icons/runtime.js"></script>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const name = query.get('app') || 'Titan app';
      const icon = query.get('icon') || 'app-mail';
      document.title = `${name} · Titan`;
      document.getElementById('app-name').textContent = name;
      document.getElementById('app-artwork').innerHTML = TitanIcons.render(icon);
    })();
  </script>
</body>
</html>
