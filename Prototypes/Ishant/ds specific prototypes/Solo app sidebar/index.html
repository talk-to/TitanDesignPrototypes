<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App sidebar</title>
  <link rel="stylesheet" href="ds/tokens.css">
  <link rel="stylesheet" href="app-sidebar.css">
  <script src="ds/theme.js"></script>
</head>
<body>
  <main class="app-stage" aria-label="App sidebar">
    <nav class="app-rail" aria-label="Switch app">
      <div class="app-rail__apps" id="app-rail-apps" role="list"></div>
      <div class="app-rail__footer" id="app-rail-footer" role="list" aria-label="Tools"></div>
    </nav>
    <div class="app-rail-tooltip" id="app-rail-tooltip" role="tooltip" hidden></div>
    <div class="more-apps-listbox" id="more-apps-listbox" role="listbox" aria-label="More apps" hidden></div>
    <section class="app-views" id="app-views" aria-label="Current app"></section>

    <!-- Demo-only controls. Delete this panel when you drop the rail into a project. -->
    <aside class="sidebar-variant-panel" aria-label="Sidebar variations">
      <label class="sidebar-variant-panel__label" for="sidebar-variant-select">Sidebar style</label>
      <select id="sidebar-variant-select" aria-label="Sidebar style">
        <option value="grayscale">Grayscale</option>
        <option value="colored">Full color</option>
        <option value="colored-all">Full color top + bottom</option>
        <option value="top-more">Top + more</option>
        <option value="centered-more">Centered + more</option>
      </select>
      <label class="sidebar-variant-panel__label" for="app-transition-select">App swap</label>
      <select id="app-transition-select" aria-label="App swap transition">
        <option value="spinner">Slide + loader</option>
        <option value="slide-skeleton">Slide + skeleton</option>
        <option value="skeleton">Instant + skeleton</option>
        <option value="instant">Instant + loader</option>
      </select>
    </aside>

    <p class="sr-only" id="app-announcement" aria-live="polite"></p>
  </main>
  <script src="app-sidebar.js"></script>
</body>
</html>
