document.querySelector('#collect').onclick=()=>{
const result=[...document.querySelectorAll('iframe')].map(frame=>{
 const doc=frame.contentDocument, roots=[...doc.querySelectorAll('.'+frame.dataset.class)];
 return {component:frame.title,registeredRoots:roots.length,textParts:roots.flatMap(root=>[root,...root.querySelectorAll('*')].filter(el=>el.getClientRects().length&&(el.matches('input:not([type=checkbox]),textarea,[contenteditable=true]')||[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))).map(el=>{const s=frame.contentWindow.getComputedStyle(el);return {part:el.className||el.localName,text:(el.value||el.getAttribute('aria-label')||el.textContent).trim().slice(0,55),fontSize:s.fontSize,weight:s.fontWeight,lineHeight:s.lineHeight,color:s.color}}))};
});document.querySelector('#results').textContent=JSON.stringify(result,null,2);
};</script>
