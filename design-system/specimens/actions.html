<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Titan actions</title><link rel="stylesheet" href="../components/actions.css"><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--titan-font-family-ui);color:var(--titan-text-primary);background:var(--titan-surface-base)}
.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));max-width:880px;gap:0;align-items:stretch}.example{display:flex;flex-direction:column;gap:18px;padding:0 20px;align-items:flex-start;border-left:1px solid var(--border-color)}.example:first-child{padding-left:0;border-left:0}.caption{font:500 10px/1.5 var(--titan-font-family-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--titan-text-muted)}.mount{min-height:52px;display:flex;align-items:center}#result{margin:16px 0 0;min-height:18px;font-size:12px;color:var(--titan-text-secondary)}
body[data-part="split-button"] .examples{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media(max-width:420px){.examples{grid-template-columns:1fr;gap:16px}.example,.example:first-child{padding:0 0 16px;border-left:0;border-bottom:1px solid var(--border-color)}}
/* Center the arrangement; align each label and control to its cell start. */
.examples{margin-inline:auto}
.example{align-items:flex-start;text-align:left}
.mount{justify-content:flex-start}
body[data-part="button"] .example:has(.titan-action-group){grid-column:1 / -1}.titan-action-group{flex-wrap:wrap}.examples{width:max-content;max-width:100%;grid-template-columns:repeat(2,minmax(0,max-content));margin-inline:auto;gap:32px 28px}
body[data-part="split-button"] .examples{grid-template-columns:max-content}
@media(max-width:300px){.examples{grid-template-columns:minmax(0,1fr)}}
.mount:has(.titan-icon-button--window){background:var(--titan-surface-composer-header);border-radius:4px;width:52px;justify-content:center}
</style><link rel="stylesheet" href="gallery.css"><script src="../theme.js"></script></head><body><main><div class="examples" id="examples"></div><p id="result" role="status" aria-live="polite"></p></main><script src="../icons/runtime.js"></script><script src="../components/actions.js"></script><script src="./actions.js"></script><script src="gallery.js"></script></body></html>
