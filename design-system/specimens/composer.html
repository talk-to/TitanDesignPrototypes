<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composer</title><link rel="stylesheet" href="../components/composer.css"><style>body{margin:0;padding:16px;background:transparent}main{width:681px;max-width:100%;margin:auto}#sample{max-width:100%}body[data-part=fieldRow] main{width:440px}.caption{font:11px var(--titan-font-family-ui);color:var(--titan-text-muted);margin:0 0 8px}body[data-part=fieldRow] section+section{margin-top:24px}</style><link rel="stylesheet" href="gallery.css"></head><body><main><div id="sample"></div><p id="result" role="status"></p></main><script src="../icons/runtime.js"></script><script src="../components/actions.js"></script><script src="../components/selection.js"></script><script src="../components/composer.js"></script><script>
const params=new URLSearchParams(location.search);const part=params.get('part')||'emailComposer';document.body.dataset.part=part;
if(part==='fieldRow'&&params.has('state')){document.getElementById('sample').innerHTML=TitanComposer.fieldRow(params.get('target')==='sender'?{label:'From',value:'alex@example.com',readOnly:true}:params.get('target')==='subject'?{label:'Subject'}:{label:'To',recipient:true});if(params.get('state')==='focus')document.querySelector('input').focus()}else if(part==='fieldRow'){document.getElementById('sample').innerHTML=[{label:'From',value:'alex@example.com',readOnly:true},{label:'To',recipient:true},{label:'Subject'}].map(o=>'<section><p class="caption">'+o.label+'</p>'+TitanComposer.fieldRow(o)+'</section>').join('')}else TitanComposer.mount(document.getElementById('sample'),part,{}, {action:command=>{document.getElementById('result').textContent='Action: '+command;},close:()=>{document.getElementById('result').textContent='Close requested';}});
if(part==='emailComposer'&&params.get('state')==='minimized')document.querySelector('.titan-composer-header__title').click();
if(part==='composerHeader'&&params.get('state')==='focus')document.querySelector('.titan-composer-header__title').focus();
</script><script src="gallery.js"></script></body></html>
