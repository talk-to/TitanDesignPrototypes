<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data list row</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/data-list-row.css"><link rel="stylesheet" href="../components/avatar.css"><link rel="stylesheet" href="../components/selection.css">
<style>body{margin:0;padding:24px;font-family:var(--titan-font-family-ui);color:var(--titan-text-primary)}.example{overflow:auto}.caption{margin-bottom:12px}#record{min-width:480px}</style><link rel="stylesheet" href="gallery.css"><script src="../theme.js"></script></head><body><main><div class="example"><p class="caption">Default</p><div id="record" role="table" aria-label="Person"></div></div></main>
<script src="../icons/runtime.js"></script><script src="../components/avatar.js"></script><script src="../components/selection.js"></script><script src="../components/data-list.js"></script><script>
const host=document.getElementById('record');host.innerHTML=TitanDataList.row({id:'ada',columns:[{key:'select',role:'control',width:'auto'},{key:'name',role:'key',width:'minmax(160px,1fr)'},{key:'email',width:'minmax(160px,1fr)'}],cells:{select:{slot:true},name:{slot:true,text:'Ada Lovelace with a long display name'},email:'ada.lovelace.with.a.long.address@titan.email'}});
host.querySelector('[data-slot="ada:name"]').innerHTML=TitanAvatar.render({initials:'AL',label:'Ada Lovelace'});TitanSelection.mount(host.querySelector('[data-slot="ada:select"]'),'checkbox',{label:'Select Ada Lovelace',size:'large'},{});
</script><script src="gallery.js"></script></body></html>
