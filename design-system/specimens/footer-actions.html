<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidebar footer actions</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/actions.css">
<style>
body{margin:0;padding:24px;font:14px var(--titan-font-family-ui);color:var(--titan-text-primary)}
main{display:grid;gap:32px;justify-content:start}
/* Previewed at the real sidebar width, and never narrower than it. */
section{width:var(--titan-sidebar-width);min-width:var(--titan-sidebar-width);background:var(--titan-surface-navigation);padding-top:24px}
.caption{font:11px var(--titan-font-family-ui);color:var(--titan-text-muted);margin:0 0 12px;padding-inline:12px}
</style>
<link rel="stylesheet" href="gallery.css"></head><body><main>
<section><p class="caption">Three actions, last icon-only</p><div id="three"></div></section>
<section><p class="caption">Two actions</p><div id="two"></div></section>
<section><p class="caption">One action</p><div id="one"></div></section>
</main>
<script src="../icons/runtime.js"></script><script src="../components/actions.js"></script>
<script>
TitanActions.mount(document.getElementById('three'),'footerActions',{label:'Feedback and settings',items:[
  {id:'bug',label:'Bug',icon:'report-bug'},{id:'feature',label:'Feature',icon:'request-feature'},{id:'settings',label:'Settings',icon:'settings',labelHidden:true}
]},{});
TitanActions.mount(document.getElementById('two'),'footerActions',{label:'Feedback',items:[
  {id:'bug',label:'Bug',icon:'report-bug'},{id:'feature',label:'Feature',icon:'request-feature'}
]},{});
TitanActions.mount(document.getElementById('one'),'footerActions',{label:'Settings',items:[
  {id:'settings',label:'Settings',icon:'settings'}
]},{});
</script><script src="gallery.js"></script></body></html>
