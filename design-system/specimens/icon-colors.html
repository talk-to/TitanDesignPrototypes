<!doctype html><html lang="en"><meta charset="utf-8"><title>Icon colors</title><link rel="stylesheet" href="../components/actions.css"><style>body{font:14px system-ui;margin:24px;color:#888}main{display:flex;gap:24px}.sample{padding:16px;border-radius:8px}.inverse{background:#333;color:white}p{margin:0 0 12px}</style><main id="samples"></main><script src="../icons/runtime.js"></script><script src="../components/actions.js"></script><script>
const samples=[['Gray','#888'],['Blue','#2170f4'],['White','white']];document.getElementById('samples').innerHTML=samples.map(([label,color])=>'<section class="sample '+(label==='White'?'inverse':'')+'"><p>'+label+'</p>'+['close','expand','compose','inbox'].map(id=>TitanActions.iconButton({label:id,icon:id,iconColor:color})).join('')+'</section>').join('');
</script></html>
