<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Titan layout guide</title><link rel="stylesheet" href="../components.css"><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px;font:14px system-ui;color:#252730;background:#f5f5f2}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.modes{display:flex;gap:4px;padding:4px;border-radius:24px;background:#e8e8ec}.modes button{border:0;border-radius:20px;padding:9px 14px;background:transparent;color:inherit;cursor:pointer}.modes button[aria-pressed=true]{background:#252730;color:white}.settings{display:flex;flex-wrap:wrap;gap:16px}label{display:flex;align-items:center;gap:8px;font-size:12px}select,button{font:inherit}select{border:1px solid #dcdce2;border-radius:8px;padding:7px;background:transparent}.stage{padding:24px;border:1px solid #dddde3;border-radius:16px;background-image:radial-gradient(#b4b4bc66 1px,transparent 1px);background-size:20px 20px}#sample{display:grid;gap:8px;margin:auto;max-width:720px}.entry{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #dedee5;border-radius:12px;background:#fff}.entry svg,.entry img{width:28px;height:28px;flex-shrink:0}.entry span{font-weight:500}.entry small{display:block;color:#737580;font-size:12px;margin-top:4px;font-weight:400}#sample[data-mode=grid]{grid-template-columns:repeat(var(--columns,3),minmax(0,1fr))}#sample[data-mode=grid] .entry{flex-direction:column;text-align:center}#sample[data-mode=row],#sample[data-mode=footer]{display:flex;flex-wrap:wrap;align-items:center}#sample[data-mode=footer]{justify-content:flex-end}#contract{font-size:12px;line-height:1.6;color:#666874;margin:20px 0 0}button:focus-visible,select:focus-visible{outline:2px solid #2170f4;outline-offset:3px}
</style></head><body><div class="toolbar"><nav class="modes" aria-label="Layout arrangement"><button data-mode="list" aria-pressed="true">List</button><button data-mode="grid" aria-pressed="false">Grid</button><button data-mode="row" aria-pressed="false">Row</button><button data-mode="footer" aria-pressed="false">Footer</button></nav><div class="settings"><label>Context <select id="context"><option value="data">Data / messages</option><option value="menu">Dropdown / menu</option><option value="sidebar">Sidebar</option><option value="form">Settings / form</option><option value="cards">Cards / content</option><option value="apps">App entries</option></select></label><label>Gap <select id="gap"><option value="0">0</option><option value="4">4</option><option value="8">8</option><option value="12">12</option><option value="16">16</option><option value="20">20</option><option value="24">24</option></select></label><label id="columns-label" hidden>Columns <select id="columns"><option>1</option><option>2</option><option selected>3</option></select></label></div></div><div class="stage"><div id="sample" data-mode="list"></div></div><p id="contract"></p><script src="../icons/runtime.js"></script><script src="../components/actions.js"></script><script src="layout-recipes.js"></script></body></html>
