<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini calendar</title><link rel="stylesheet" href="../components/mini-calendar.css"><style>body{margin:0;padding:16px;font:14px var(--titan-font-family-ui)}main{width:250px;max-width:100%;margin:auto}#output{font-size:12px;margin:8px 0 0;color:var(--titan-text-muted)}</style><link rel="stylesheet" href="gallery.css"><script src="../theme.js"></script></head><body><main><div id="sample"></div><p id="output" role="status"></p></main><script src="../icons/runtime.js"></script><script src="../components/actions.js"></script><script src="../components/mini-calendar.js"></script><script>
const q=new URLSearchParams(location.search),state=q.get('state')||'live';
const control=TitanMiniCalendar.mount(document.getElementById('sample'),{value:state==='default'?null:'2026-09-09',month:'2026-09',disabled:state==='disabled'},{dateChange:({value})=>document.getElementById('output').textContent='Selected date: '+value,monthChange:({month})=>document.getElementById('output').textContent='Visible month: '+month});
if(state==='focus')document.querySelector('[data-date="2026-09-09"]').focus();
if(state!=='live')document.querySelectorAll('button').forEach(b=>b.tabIndex=-1);
</script><script src="gallery.js"></script></body></html>
