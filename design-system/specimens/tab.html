<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab treatments</title><style>body{margin:0;padding:12px;font-family:var(--titan-font-family-ui)}#examples{display:grid;max-width:420px;margin:auto}.example{padding:16px}.example+.example{border-top:1px solid var(--border-color)}.caption{margin:0 0 8px;font-size:12px;color:var(--titan-text-muted)}</style><link rel="stylesheet" href="../components/selection.css"><link rel="stylesheet" href="gallery.css"><script src="../theme.js"></script></head><body><main id="examples"></main><script src="../icons/runtime.js"></script><script src="../components/selection.js"></script><script>
const group=new URLSearchParams(location.search).get('group')==='1';
for(const variant of ['filled','underline']){const section=document.createElement('section');section.id=variant;section.className='example';section.innerHTML='<p class="caption">'+variant[0].toUpperCase()+variant.slice(1)+'</p><div class="sample"></div>';document.getElementById('examples').append(section);const host=section.querySelector('.sample');if(group)TitanSelection.mount(host,'tabs',{label:'Categories',variant,items:[{id:'first',label:'Priority',count:25},{id:'second',label:'Other',count:50},{id:'third',label:'Updates',count:12},{id:'fourth',label:'All',count:87}]});else{host.setAttribute('role','tablist');host.setAttribute('aria-label',variant+' tab example');const control=TitanSelection.mount(host,'tab',{id:variant,label:'Priority',count:25,variant,selected:true},{activate:()=>control.update({selected:true})});}}
</script><script src="gallery.js"></script></body></html>
