<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace pattern</title><style>
*{box-sizing:border-box}html,body{margin:0}body{padding:24px;background:var(--titan-surface-reading);color:var(--titan-text-secondary);font:13px/1.5 system-ui}main{max-width:900px;margin:auto}.workspace{position:relative;height:320px;border:1px solid var(--border-color);border-radius:6px;overflow:hidden;background:var(--titan-surface-base)}.top{height:48px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--titan-surface-subtle)}.panes{display:grid;grid-template-columns:22% 30% 1fr;height:calc(100% - 48px)}.pane{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center}.pane+.pane{border-left:1px solid var(--border-color)}.pane:first-child{background:var(--titan-surface-subtle)}.pane small{color:var(--titan-text-muted)}.drawer{position:absolute;right:0;top:0;bottom:0;width:36%;min-width:180px;background:var(--titan-surface-base);border-left:1px solid var(--border-color);box-shadow:-8px 0 20px #0002;display:flex;flex-direction:column}.drawer{transform:translateX(105%);visibility:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1),visibility 0s .3s}.drawer.is-open{transform:translateX(0);visibility:visible;transition-delay:0s}@media(prefers-reduced-motion:reduce){.drawer{transition:none}}.drawer header{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.drawer-content{flex:1;display:grid;place-items:center;color:var(--titan-text-muted)}.drawer footer{padding:14px 16px;border-top:1px solid #ddd;color:#777}button{font:inherit;border:1px solid var(--border-color);border-radius:4px;background:var(--titan-surface-base);padding:5px 10px;color:var(--titan-text-secondary);cursor:pointer}button:focus-visible{outline:2px solid #666;outline-offset:2px}.guide{margin-top:20px;display:grid;gap:8px}.guide p{margin:0}.guide strong{font-weight:600;color:#444}@media(max-width:480px){body{padding:12px}.workspace{height:280px}.pane{padding:8px;font-size:11px}}
.workspace{display:grid;grid-template-columns:22% 1fr;grid-template-rows:48px 1fr}.navigation{grid-column:1;grid-row:1 / -1;border-right:1px solid var(--border-color);background:var(--titan-surface-subtle)}.top{grid-column:2;grid-row:1}.panes{grid-column:2;grid-row:2;grid-template-columns:38.5% 1fr;height:100%}.panes .pane:first-child{background:var(--titan-surface-base)}
</style><script src="../theme.js"></script></head><body><main><div class="workspace"><div class="pane navigation"><strong>Section 1</strong></div><div class="top"><span>Upper section</span><button id="open" hidden>Open panel</button></div><div class="panes"><div class="pane"><strong>Section 2</strong></div><div class="pane"><strong>Section 3</strong></div></div><aside id="drawer" class="drawer" aria-label="Side panel" hidden><header><strong>Side panel</strong><button id="close" aria-label="Close panel">×</button></header><div class="drawer-content">Supporting content</div><footer>Optional actions</footer></aside></div><div id="guide" class="guide"></div></main><script>
const overlay=new URLSearchParams(location.search).get('pattern')==='overlay';const drawer=document.getElementById('drawer'),open=document.getElementById('open');open.hidden=!overlay;drawer.hidden=!overlay;const setOpen=value=>{drawer.classList.toggle('is-open',value);drawer.inert=!value;drawer.setAttribute('aria-hidden',String(!value));open.setAttribute('aria-expanded',String(value));};setOpen(false);if(overlay)requestAnimationFrame(()=>requestAnimationFrame(()=>setOpen(true)));
open.onclick=()=>setOpen(true);document.getElementById('close').onclick=()=>{setOpen(false);open.focus();};
document.getElementById('guide').innerHTML=overlay?'<p><strong>Use for</strong> supporting tasks that should keep the current workspace in view.</p><p>The panel sits above the page. Opening it does not resize the content underneath.</p><p>Keep the close action visible; let long panel content scroll independently.</p>':'<p>Three adjacent sections. Section 1 spans the full height; the upper section spans sections 2 and 3.</p><p>Widths shown are illustrative. Choose widths, scrolling and a smaller-screen arrangement for the consuming screen.</p><p>Each section can hold any content.</p>';
</script></body></html>
